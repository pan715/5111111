<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MindAR 圖片辨識</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    a-scene {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }
    .mindar-ui-loading,
    .mindar-ui-error,
    .mindar-ui-scanning {
      display: none;
    }
    #custom-text {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 0.5em 1em;
      font-size: 1.5em;
      border-radius: 0.3em;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="custom-text">雞傷心會變成什麼?emo ji。</div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; showStats: false; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    // 事件綁定在 a-scene 上，不是 entity！
    const scene = document.querySelector('a-scene');
    const customDiv = document.querySelector('#custom-text');

    scene.addEventListener('targetFound', () => {
      customDiv.style.display = 'block';
    });

    scene.addEventListener('targetLost', () => {
      customDiv.style.display = 'none';
    });
  </script>
</body>
</html>
